name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    # Build-time module evaluation needs syntactically valid config (auth
    # config is imported by the app), not a reachable database — no
    # Postgres service here, and these are non-secret placeholder values,
    # never real credentials.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-build-time-placeholder-secret-not-real-00
      BETTER_AUTH_URL: http://localhost:3000
      # Syntactically valid only — env validation needs a non-empty string;
      # nothing in CI (build or tests) makes a real TMDB request, so this
      # never needs to be a real token. See docs/media-provider.md.
      TMDB_API_TOKEN: ci-build-time-placeholder-token-not-real
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Auth E2E tests exercise real sign-up/sign-in against a real database —
    # this is a disposable, test-only Postgres service, never a developer
    # or production database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-e2e-placeholder-secret-not-a-real-secret-0
      BETTER_AUTH_URL: http://localhost:3000
      # See the `quality` job above — placeholder only, no real TMDB call.
      TMDB_API_TOKEN: ci-e2e-placeholder-token-not-real
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
